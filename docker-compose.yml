services:
  # Static Flutter web app served by nginx.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: patrimonio-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # Rust API server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Reach Postgres/Redis over the internal compose network by SERVICE
      # NAME (not host.docker.internal + a host port). This lets the host
      # ports be bound to loopback only — see the postgres/redis blocks —
      # so the DB and session store are never exposed on 0.0.0.0.
      DATABASE_URL: postgres://patrimonio:${POSTGRES_PASSWORD:-patrimonio}@postgres:5432/patrimonio
      REDIS_URL: redis://:${REDIS_PASSWORD:-patrimonio}@redis:6379
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_WEBHOOK_URL: ${PLAID_WEBHOOK_URL:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      EXCHANGE_RATE_API_KEY: ${EXCHANGE_RATE_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      COINBASE_CLIENT_ID: ${COINBASE_CLIENT_ID:-}
      COINBASE_CLIENT_SECRET: ${COINBASE_CLIENT_SECRET:-}
      COINBASE_REDIRECT_URI: ${COINBASE_REDIRECT_URI:-http://localhost:8080/api/auth/coinbase/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Local dev uses plain http://localhost where Secure cookies
      # would be silently rejected. Prod sets COOKIE_SECURE=true (also
      # auto-on when FRONTEND_BASE_URL is https). Production
      # docker-compose overrides should drop this override.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Default info; flip to debug only for active debugging — debug
      # can write request/response metadata that includes auth headers
      # or other sensitive context into stdout.
      RUST_LOG: ${RUST_LOG:-patrimonio=info,tower_http=info}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    ports:
      # Bound to loopback by default. The api reaches postgres over the
      # internal compose network (service name `postgres:5432`), so the
      # host port is only for the operator's own psql/backup tooling and
      # must NOT be on 0.0.0.0. Override POSTGRES_BIND only if you have a
      # specific reason (and never to 0.0.0.0 on a networked host).
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: patrimonio
      # Default is "patrimonio" to keep local dev one-command-up; the
      # api binary logs a loud warning at boot if the live password
      # equals the default, so a prod deploy that forgot to override
      # gets caught on the first log scrape. See .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-patrimonio}
      POSTGRES_DB: patrimonio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrimonio"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  # Redis cache + session / WebAuthn-ceremony store
  redis:
    image: redis:7-alpine
    ports:
      # Loopback only (same rationale as postgres). The api reaches redis
      # over the internal network (service name `redis:6379`).
      - "${REDIS_BIND:-127.0.0.1}:${REDIS_PORT:-6380}:6379"
    environment:
      # Used by both the server (--requirepass) and the healthcheck below.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-patrimonio}
    # Require auth: redis holds session tokens + in-flight WebAuthn state,
    # so an unauthenticated instance is a credential-store exposure.
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  redisdata:
