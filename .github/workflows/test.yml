name: Tests

# Runs the backend integration suite (against a real Postgres) and the Flutter
# analyze/test on every push to main and every PR. This exists because the
# integration suite was silently SKIPPING for a long time — scripts/test.sh
# defaulted to the pre-rotation Postgres password, the harness returned None on
# the failed connection, and every DB-backed test counted as a vacuous pass,
# shipping real SQL bugs (the FBAR + statement-continuity 500s) undetected.
# CI gives the suite a Postgres it can actually reach, and tests/common/mod.rs
# now PANICS on a configured-but-unreachable DB, so a broken setup fails loudly
# here instead of skipping.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (cargo test + integration suite)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: patrimonio
          POSTGRES_PASSWORD: patrimonio
          POSTGRES_DB: patrimonio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patrimonio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The integration harness reads this; an unreachable/misconfigured DB now
      # panics (it no longer silently skips), so a green run means the suite
      # genuinely ran.
      PATRIMONIO_TEST_DATABASE_URL: postgres://patrimonio:patrimonio@localhost:5432/patrimonio_test
      # The round-4 dividend-cache integration tests read this; setting it means
      # they RUN in CI (and panic loudly if Redis is unreachable, rather than
      # silently skipping — same policy as the DB harness above).
      PATRIMONIO_TEST_REDIS_URL: redis://localhost:6379
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      # 1.88.0 must match backend/rust-toolchain.toml and backend/Dockerfile
      # (FROM rust:1.88-slim). Pinning all three keeps `cargo clippy` results
      # identical locally, in CI, and in the prod build — clippy lints drift
      # between Rust versions (e.g. uninlined_format_args moved to `pedantic`
      # after 1.88), so an unpinned local toolchain would miss what CI flags.
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libssl-dev
      # Lint gate: the tree is clippy-clean, so any new warning fails the build.
      # The stricter panic/unwrap restriction lints are documented guidance in
      # .agent/skills/rust-backend/rust-conventions.md rather than gated here
      # (the existing codebase carries too much pre-existing debt to deny them).
      # NO `cargo fmt --check` here yet: the backend tree is NOT rustfmt-clean
      # (79 of 97 files, ~1090 hunks as of b262467), so gating it would fail
      # every build. It carries the same hazard the frontend just shed — see
      # AGENTS.md "Enforcement" — and wants the same one-shot sweep before this
      # gate can be turned on.
      - name: cargo clippy (warnings are errors)
        working-directory: backend
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (unit + integration; serial via the shared test DB)
        working-directory: backend
        run: cargo test -- --test-threads=1

  frontend:
    name: Frontend (analyze + test)
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:stable
    steps:
      - uses: actions/checkout@v4
      - name: flutter pub get
        working-directory: frontend
        run: flutter pub get
      # Formatting gate. The Dart tree went unformatted for a long time (197 of
      # 252 files), which made `dart format` — and any editor's format-on-save —
      # a hazard: touching one file reflowed the whole thing and buried the real
      # change in the diff. b262467 formatted it; this keeps it formatted.
      # Generated l10n is included deliberately: gen-l10n already emits
      # formatted output, so it stays clean without an exclusion.
      - name: dart format (the tree is formatter-clean; keep it that way)
        working-directory: frontend
        run: dart format --output=none --set-exit-if-changed lib test
      - name: flutter analyze (errors + warnings fatal; infos are not)
        working-directory: frontend
        run: flutter analyze --no-fatal-infos
      - name: flutter test (excluding local-only golden screenshots)
        working-directory: frontend
        run: flutter test --exclude-tags golden
      # Build the release APK so the Android build config can't silently break.
      # This is a BUILD gate, not a runtime one: it catches broken Gradle/R8
      # config (e.g. a malformed proguard-rules.pro) and dependency/manifest
      # regressions. It does NOT catch launch-time crashes — those are found by
      # the emulator smoke test documented in AGENTS.md ("Android APK"), which
      # is a manual/local step (an emulator is too heavy for this job). CI has no
      # android/key.properties, so R8 runs with the same minify config as a real
      # release but the APK falls back to debug signing.
      - name: flutter build apk --release (Android build gate)
        working-directory: frontend
        run: flutter build apk --release
