# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

linter:
  # The lint rules applied to this project can be customized in the
  # section below to disable rules from the `package:flutter_lints/flutter.yaml`
  # included above or to enable additional rules. A list of all available lints
  # and their documentation is published at https://dart.dev/lints.
  #
  # Instead of disabling a lint rule for the entire project in the
  # section below, it can also be suppressed for a single line of code
  # or a specific dart file by using the `// ignore: name_of_lint` and
  # `// ignore_for_file: name_of_lint` syntax on the line or in the file
  # producing the lint.
  rules:
    # avoid_print: false  # Uncomment to disable the `avoid_print` rule
    # prefer_single_quotes: true  # Uncomment to enable the `prefer_single_quotes` rule
    # Surface const-eligibility hints so we can keep widget rebuild
    # cost down. Info-level only (the brief explicitly says info lints
    # are OK), but it gives us a working list of strip-and-restore
    # cleanup candidates.
    prefer_const_constructors: true
    # Resource-safety guardrails (see .agent/skills/flutter-frontend/
    # dart-flutter-conventions.md "Lifecycle & resources"). Both had a ZERO
    # backlog when added, and are promoted to `error` below so a future
    # undisposed stream/sink fails the build rather than leaking silently.
    cancel_subscriptions: true
    close_sinks: true
    # Cheap error-hygiene wins (also zero backlog): keep stack traces on
    # rethrow, and prefer immutable locals.
    use_rethrow_when_possible: true
    prefer_final_locals: true
    # Import ordering (whole tree cleaned via `dart fix`; auto-fixable, so it
    # stays clean).
    directives_ordering: true
    # NOT enabled — deliberately deferred: avoid_catches_without_on_clauses
    # (~186 sites). The only mechanical fix (`catch (e)` -> `on Object catch (e)`)
    # is behaviour-identical and just silences the lint; doing it RIGHT means
    # narrowing each catch to its real exception type — real per-site work with
    # real risk, not a sweep. Revisit deliberately, file by file.

analyzer:
  errors:
    # Promote the resource-safety lints to build-breaking so leaks can't
    # accumulate again. Safe because the current tree has zero of either.
    cancel_subscriptions: error
    close_sinks: error

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
