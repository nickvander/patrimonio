# WebSocket upgrade plumbing for the /api/realtime/ws proxy below. `map` is an
# http-context directive; conf.d/*.conf is included inside http{}, so it's legal
# here. Resolves to "upgrade" for a real WS handshake and "close" otherwise, so
# the same /api location serves plain XHR and websockets without a hardcoded
# Connection header leaking onto keep-alive requests.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Same-origin API proxy. When the app is served over HTTPS (behind a TLS
  # proxy / tunnel) the Flutter client talks to the API at `/api` on this same
  # origin instead of `http://host:8080` — that dodges mixed-content blocking
  # and lets a single https origin carry the app, its XHRs, and the Plaid OAuth
  # redirect. On plain-http localhost the client still hits :8080 directly, so
  # this proxy is simply unused there. The backend's routes already live under
  # /api, so the prefix is forwarded unchanged.
  #
  # Variable upstream + resolver: forces per-request DNS via Docker's embedded
  # resolver so an `api` container restart (new IP) doesn't pin nginx to a dead
  # address the way a static proxy_pass would.
  resolver 127.0.0.11 ipv6=off valid=30s;
  location /api/ {
    set $upstream_api api;
    proxy_pass http://$upstream_api:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # WebSocket upgrade for /api/realtime/ws (no-op for ordinary requests).
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    # Match the backend's 100 MB import limit. nginx's default is 1 MB,
    # which blocks PDF/CSV statement uploads before they reach the API.
    client_max_body_size 100m;
    # Don't buffer the request body before forwarding. With buffering on
    # (the default), nginx spools the entire multipart upload to disk
    # before the backend sees a single byte — so the backend never
    # registers the progress job until the whole upload is buffered,
    # making every progress poll return 404 during the upload phase.
    # Disabling it lets the backend start receiving (and processing) the
    # stream immediately, so progress ticks from the first file onward.
    proxy_request_buffering off;
  }

  # Digital Asset Links for the native Android app. Served by the API
  # (fingerprints come from ANDROID_APK_CERT_SHA256 — the same env var
  # that feeds the allowed WebAuthn origins) rather than a static file,
  # so the two can't drift apart. Google's servers fetch this URL to
  # authorize the APK for passkey ceremonies on this domain; if the
  # deployment sits behind Cloudflare Access, this exact path needs an
  # edge Bypass policy (see docs/deployment.md).
  location = /.well-known/assetlinks.json {
    set $upstream_api api;
    proxy_pass http://$upstream_api:8080$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # ---------------------------------------------------------------------------
  # Security headers. nginx's add_header has a footgun: when ANY child block
  # declares its own add_header, ALL parent add_header entries are dropped for
  # that location. To dodge that we wrap the security set in a snippet and
  # `include` it inside every location block below. Duplicate-but-reliable.
  #
  #   X-Content-Type-Options: stops browsers MIME-sniffing image/script types
  #     — closes the classic "upload a .jpg with embedded JS" surface.
  #   X-Frame-Options DENY:   un-iframeable, defeats clickjacking.
  #   Referrer-Policy no-referrer: don't leak Patrimonio URLs to third parties.
  #   Strict-Transport-Security: enforces HTTPS for a year. Harmless over plain
  #     HTTP (browser ignores), locks in HTTPS once we're behind a TLS proxy.
  #   Content-Security-Policy: see security_headers.conf for the breakdown of
  #     each directive — Flutter web's inline boot script + canvaskit eval +
  #     Plaid Link's CDN dictate the relaxations.
  # ---------------------------------------------------------------------------

  # The MaterialIcons font sits at a stable URL that doesn't change between
  # builds, so `immutable` is wrong for it — browsers would never re-fetch it
  # even when the subset changes (e.g. a new icon is added). Serve it with
  # no-cache so the browser revalidates on each load; the ETag ensures it only
  # re-downloads when the content actually changed (tiny round-trip cost).
  location ~* ^/assets/fonts/MaterialIcons {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/security_headers.conf;
  }

  # Long-cache content-addressed assets — their paths (build-hash directories
  # in /assets/, /canvaskit/, /icons/) change when the content does, so the
  # browser fetches fresh URLs after a rebuild and the cache hits are safe.
  location ~* ^/(assets|canvaskit|icons)/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/conf.d/security_headers.conf;
  }

  # Never cache the Flutter entry points. Without this, an updated
  # main.dart.js can sit invisible in the browser cache for up to an hour
  # after a rebuild — the user thinks "I lost work" because their build is
  # stale. Forcing re-validation here means a rebuild reaches them on the
  # next refresh, while the hashed bundle URLs above still ride the cache.
  location ~* ^/(main\.dart\.js|flutter_bootstrap\.js|flutter_service_worker\.js|version\.json|manifest\.json|index\.html|\.last_build_id)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires off;
    include /etc/nginx/conf.d/security_headers.conf;
  }

  # SPA fallback. Any URL that doesn't match a real file serves index.html
  # so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires off;
    include /etc/nginx/conf.d/security_headers.conf;
  }
}
