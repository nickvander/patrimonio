<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Patrimonio — Personal Finance Tracker">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Patrimonio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon — SVG first for crisp Retina rendering, PNG as
       fallback for older browsers (Chrome <80 / Safari <16) that
       don't accept SVG as a link rel="icon" source. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>

  <title>Patrimonio</title>
  <link rel="manifest" href="manifest.json">

  <!-- ===== Splash / Loading Screen Styles ===== -->
  <style>
    /* Match the app's dark theme so there's no flash */
    html, body {
      margin: 0;
      padding: 0;
      background-color: #101016;
      height: 100%;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #101016;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      transition: opacity 0.5s ease-out;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo mark — the SVG below has its own rounded-square
       background built in, so the splash-logo container is just
       a sizing + glow wrapper. The glow is a soft brand-green
       drop-shadow that pulses to signal "loading" without a
       spinner; once the Flutter app boots the whole splash
       fades out. */
    .splash-logo {
      width: 96px;
      height: 96px;
      margin-bottom: 28px;
      animation: pulse-glow 2.4s ease-in-out infinite;
      filter: drop-shadow(0 12px 32px rgba(0, 230, 118, 0.28));
    }

    .splash-logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes pulse-glow {
      0%, 100% {
        filter: drop-shadow(0 12px 32px rgba(0, 230, 118, 0.22));
        transform: scale(1.0);
      }
      50% {
        filter: drop-shadow(0 14px 40px rgba(0, 230, 118, 0.45));
        transform: scale(1.04);
      }
    }

    .splash-title {
      color: #E0E0E0;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .splash-subtitle {
      color: #888;
      font-size: 14px;
      font-weight: 400;
      margin-bottom: 40px;
    }

    /* Progress bar */
    .progress-track {
      width: 200px;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 10%;
      background: linear-gradient(90deg, #00E676, #69F0AE);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .splash-status {
      color: #666;
      font-size: 12px;
      margin-top: 16px;
      min-height: 18px;
    }
  </style>
</head>
<body>
  <!-- ===== Splash Screen (pure HTML — shows instantly) =====
       The SVG inlined below is the Patrimonio brand mark: three
       ascending columns + a summit dot on an emerald-gradient
       rounded square. Kept inline (rather than <img src=...>)
       so it paints with the rest of the splash HTML on the first
       frame, before any network round-trip for the SVG asset. -->
  <div id="splash">
    <div class="splash-logo">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none">
        <defs>
          <linearGradient id="splash-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#00E676"/>
            <stop offset="100%" stop-color="#009B4A"/>
          </linearGradient>
          <linearGradient id="splash-bar" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
            <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.88"/>
          </linearGradient>
        </defs>
        <rect width="64" height="64" rx="14" ry="14" fill="url(#splash-bg)"/>
        <rect x="14" y="38" width="8" height="14" rx="3" fill="#FFFFFF" opacity="0.55"/>
        <rect x="28" y="28" width="8" height="24" rx="3" fill="#FFFFFF" opacity="0.78"/>
        <rect x="42" y="18" width="8" height="34" rx="3" fill="url(#splash-bar)"/>
        <circle cx="46" cy="11" r="4" fill="#FFFFFF"/>
      </svg>
    </div>
    <div class="splash-title">Patrimonio</div>
    <div class="splash-subtitle">Personal Finance Tracker</div>
    <div class="progress-track">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div class="splash-status" id="splash-status">Initializing…</div>
  </div>

  <!-- Plaid Link Runtime -->
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js" async defer></script>

  <script>
    // ===== Progress helper =====
    const progressBar = document.getElementById('progress-bar');
    const splashStatus = document.getElementById('splash-status');
    const splash = document.getElementById('splash');

    window.__splashProgress = function(percent, message) {
      if (progressBar) progressBar.style.width = percent + '%';
      if (splashStatus) splashStatus.textContent = message;
    };

    window.__splashDone = function() {
      if (!splash) return;
      setTimeout(() => {
        splash.classList.add('fade-out');
        setTimeout(() => splash.remove(), 600);
      }, 200);
    };

    window.__splashProgress(15, 'Loading engine…');
  </script>

  <!-- Flutter bootstrap (generated by build, sets buildConfig + calls loader) -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
