add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP breakdown:
#   default-src 'self'                                — block everything by default
#   script-src 'self' 'unsafe-inline' 'unsafe-eval'   — flutter_bootstrap.js inlines a tiny shim
#       https://cdn.plaid.com                          — Plaid Link runtime
#       https://www.gstatic.com                        — canvaskit
#   style-src 'self' 'unsafe-inline'                  — Material widgets inline styles
#       https://fonts.googleapis.com                   — Google Fonts (Inter)
#   font-src 'self' https://fonts.gstatic.com data:
#   img-src 'self' data: https:                       — institution logos via Plaid
#   connect-src 'self' http://localhost:8080
#       http://127.0.0.1:8080 https: wss:             — every outbound API
#   frame-src https://cdn.plaid.com                   — Plaid Link iframe
#   object-src 'none', base-uri 'self',
#       form-action 'self'                            — defence in depth
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.plaid.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 https: wss:; frame-src https://cdn.plaid.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
