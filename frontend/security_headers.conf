add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# HSTS is always emitted; browsers ignore it on plain http per RFC 6797
# so the dev origin is unaffected. In prod (behind a TLS proxy) the
# header locks in HTTPS for a year. A future prod nginx override can
# bump max-age and add `preload` if we ever submit to the preload list.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP breakdown:
#   default-src 'self'                                — block everything by default
#   script-src 'self' 'unsafe-inline'
#       'unsafe-eval' 'wasm-unsafe-eval'              — flutter_bootstrap inlines a shim, dart2js
#                                                       eval's globals, canvaskit compiles WASM
#                                                       (Chrome 95+ needs the wasm-* directive
#                                                       separate from unsafe-eval)
#       https://cdn.plaid.com                          — Plaid Link runtime
#       https://www.gstatic.com                        — canvaskit
#   style-src 'self' 'unsafe-inline'                  — Material widgets inline styles
#       https://fonts.googleapis.com                   — Google Fonts (Inter)
#   font-src 'self' https://fonts.gstatic.com data:
#   img-src 'self' data: https: blob:                 — institution logos via Plaid, fl_chart
#                                                       paint output, file picker previews
#   connect-src 'self' http://localhost:8080
#       http://127.0.0.1:8080 https: wss:             — every outbound API
#       https://www.gstatic.com                        — canvaskit fetches the .wasm blob
#   worker-src 'self' blob:                           — Flutter web spawns workers from blob:
#   frame-src https://cdn.plaid.com                   — Plaid Link iframe
#   object-src 'none', base-uri 'self',
#       form-action 'self'                            — defence in depth
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' https://cdn.plaid.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8080 http://127.0.0.1:8080 https: wss:; worker-src 'self' blob:; frame-src https://cdn.plaid.com; object-src 'none'; base-uri 'self'; form-action 'self';" always;
