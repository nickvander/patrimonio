[package]
name = "patrimonio"
version = "0.1.0"
edition = "2021"
description = "Cross-platform personal finance tracker"

[dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart", "ws"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "catch-panic"] }
# Streaming primitives used by the CSV export. `bytes::Bytes` is the
# wire type axum's `Body::from_stream` wants; `tokio-stream` gives
# us `wrappers::ReceiverStream` so an mpsc channel can feed the
# response body chunk-by-chunk without buffering the whole CSV
# in memory.
bytes = "1"
tokio-stream = "0.1"
# `futures::StreamExt::try_next` to consume sqlx's row stream.
futures-util = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }

# Caching
redis = { version = "0.27", features = ["tokio-comp"] }

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde", "serde-float"] }
rust_decimal_macros = "1"

# HTTP client (for Plaid, exchange rates)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Encryption (for Plaid tokens)
aes-gcm = "0.10"
hex = "0.4"
# Parses TRUSTED_PROXY_CIDRS into IpNet ranges so the proxy-aware
# client_ip middleware can strip X-Forwarded-For when the TCP peer
# isn't in the allow-list. Tiny crate, no dep tail.
ipnet = "2"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
# SHA-1 is used ONLY for the HIBP k-anonymity password breach check —
# we send the first 5 hex chars of the SHA-1 prefix to api.pwnedpasswords.com
# and search the returned suffix list. SHA-1 here is a corpus index, not
# a security primitive; the legacy hash is dictated by the HIBP protocol.
sha1 = "0.10"

# Password hashing (user login)
argon2 = "0.5"
base64 = "0.22"
time = "0.3"

# TOTP (RFC 6238) for opt-in 2FA. The `otpauth` feature gives us
# TOTP::new with issuer + account_name and the get_url() method that
# emits the otpauth:// URI for QR code rendering.
totp-rs = { version = "5.6", features = ["otpauth"] }

# WebAuthn / FIDO2 for passkey login. Maintained by the WebAuthn working
# group. We use the high-level Passkey API rather than the lower-level
# raw protocol surface. The `danger-allow-state-serialisation` feature
# is required to serialise the per-flow PasskeyRegistration /
# PasskeyAuthentication state into Redis between the start and finish
# halves of each ceremony.
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
url = "2"

# JWT verification for the Plaid webhook signature. Plaid signs every
# webhook body with an ES256 JWT in the `Plaid-Verification` header;
# the receiver fetches the signing key from Plaid's
# /webhook_verification_key/get endpoint, verifies the signature, and
# checks that the JWT's `request_body_sha256` claim matches the SHA-256
# of the raw request body. We use the JWK extraction path so the key
# rotation flow (Plaid issues new key IDs periodically) is automatic.
jsonwebtoken = "9"

# Scheduling
tokio-cron-scheduler = "0.13"
csv = "1.3"
lopdf = "0.34"

[dev-dependencies]
# Per-test serialization. The integration tests under tests/ share a
# Postgres + TRUNCATE in setup, so running them in parallel races and
# wipes each other's data. Previously `--test-threads=1` was pinned at
# the wrapper (scripts/test.sh) level; with #[serial_test::serial] on
# every #[tokio::test] in the integration files, plain `cargo test`
# Just Works regardless of thread count.
serial_test = "3"
