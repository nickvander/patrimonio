[package]
name = "patrimonio"
version = "0.1.0"
edition = "2021"
description = "Cross-platform personal finance tracker"

[dependencies]
# Web framework
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "rust_decimal"] }

# Caching
redis = { version = "0.27", features = ["tokio-comp"] }

# Types
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }

# HTTP client (for Plaid, exchange rates)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Configuration
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Encryption (for Plaid tokens)
aes-gcm = "0.10"
hex = "0.4"
rand = "0.8"

# Scheduling
tokio-cron-scheduler = "0.13"
